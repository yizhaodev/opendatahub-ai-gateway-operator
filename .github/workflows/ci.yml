name: CI

on:
  push:
  pull_request:

permissions: {}

env:
  CONTAINER_TOOL: docker
  CI_IMG: localhost/ai-gateway-operator:ci

jobs:
  lint:
    permissions:
      contents: read
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

  test:
    permissions:
      contents: read
    name: Unit + Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: make test

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind

      - name: Download batch-gateway manifests
        run: make get-manifests

      - name: Integration tests
        run: make test-integration

      - name: Show created resources
        if: always()
        run: |
          NS="integration-test"
          echo "=== Deployments in ${NS} ==="
          kubectl get deployments -n "${NS}" -o wide 2>/dev/null || true
          echo ""
          echo "=== Pods in ${NS} ==="
          kubectl get pods -n "${NS}" -o wide 2>/dev/null || true
          echo ""
          echo "=== Services in ${NS} ==="
          kubectl get services -n "${NS}" -o wide 2>/dev/null || true
          echo ""
          echo "=== ConfigMaps in ${NS} ==="
          kubectl get configmaps -n "${NS}" 2>/dev/null || true
          echo ""
          echo "=== ServiceAccounts in ${NS} ==="
          kubectl get serviceaccounts -n "${NS}" 2>/dev/null || true
          echo ""
          echo "=== ClusterRoles (aigateway) ==="
          kubectl get clusterroles -l platform.opendatahub.io/part-of=aigateway 2>/dev/null || true
          echo ""
          echo "=== ClusterRoleBindings (aigateway) ==="
          kubectl get clusterrolebindings -l platform.opendatahub.io/part-of=aigateway 2>/dev/null || true
          echo ""
          echo "=== CRDs (batch.llm-d.ai) ==="
          kubectl get crds -l platform.opendatahub.io/part-of=aigateway 2>/dev/null || true
          echo ""
          echo "=== AIGateway CR ==="
          kubectl get aigateways.components.platform.opendatahub.io -o yaml 2>/dev/null || true

  e2e:
    permissions:
      contents: read
    name: E2E
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind

      - name: Build container image
        run: make container-build IMG="${CI_IMG}"

      - name: Load image into Kind
        run: kind load docker-image "${CI_IMG}" --name kind

      - name: Generate Helm chart
        run: make helm

      - name: Run E2E tests
        run: |
          make test-e2e \
            IMG="${CI_IMG}" \
            HELM_EXTRA_ARGS="--set-string image.pullPolicy=IfNotPresent"

      - name: Show created resources
        if: always()
        run: |
          NS="opendatahub-ai-gateway-system"
          echo "=== Module operator ==="
          echo "--- Deployment ---"
          kubectl get deployment -n "${NS}" -o wide 2>/dev/null || true
          echo "--- Pods ---"
          kubectl get pods -n "${NS}" -o wide 2>/dev/null || true
          echo ""
          echo "=== Batch-gateway operator resources ==="
          echo "--- Deployments ---"
          kubectl get deployment batch-gw-operator-controller-manager -n "${NS}" -o wide 2>/dev/null || true
          echo "--- Pods ---"
          kubectl get pods -n "${NS}" -l app.kubernetes.io/name=batch-gw-operator -o wide 2>/dev/null || true
          echo "--- Services ---"
          kubectl get services -n "${NS}" 2>/dev/null || true
          echo "--- ServiceAccounts ---"
          kubectl get serviceaccounts -n "${NS}" 2>/dev/null || true
          echo "--- ConfigMaps ---"
          kubectl get configmaps -n "${NS}" 2>/dev/null || true
          echo ""
          echo "=== Cluster-scoped resources ==="
          echo "--- ClusterRoles (aigateway) ---"
          kubectl get clusterroles -l platform.opendatahub.io/part-of=aigateway 2>/dev/null || true
          echo "--- ClusterRoleBindings (aigateway) ---"
          kubectl get clusterrolebindings -l platform.opendatahub.io/part-of=aigateway 2>/dev/null || true
          echo "--- Batch-gateway ClusterRole ---"
          kubectl get clusterrole batch-gw-operator-manager-role -o wide 2>/dev/null || true
          echo "--- CRDs ---"
          kubectl get crds llmbatchgateways.batch.llm-d.ai 2>/dev/null || true
          kubectl get crds aigateways.components.platform.opendatahub.io 2>/dev/null || true
          echo ""
          echo "=== AIGateway CR status ==="
          kubectl get aigateways.components.platform.opendatahub.io -o yaml 2>/dev/null || true

      - name: Show pod logs on failure
        if: failure()
        run: |
          NS="opendatahub-ai-gateway-system"
          echo "=== Module operator logs ==="
          kubectl logs -n "${NS}" -l app.kubernetes.io/name=opendatahub-ai-gateway-operator --tail=100 2>/dev/null || true
          echo ""
          echo "=== Batch-gateway operator logs ==="
          kubectl logs -n "${NS}" -l app.kubernetes.io/name=batch-gw-operator --tail=100 2>/dev/null || true
          echo ""
          echo "=== Events ==="
          kubectl get events -n "${NS}" --sort-by='.lastTimestamp' 2>/dev/null || true
